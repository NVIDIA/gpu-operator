name: E2E Tests

on:
  workflow_call:
    inputs:
      operator_image:
        required: true
        type: string
      operator_version:
        required: true
        type: string
      chart_reference:
        description: 'Published Helm chart to test instead of publishing one from this commit (set chart_version, and operator_version to its appVersion)'
        required: false
        type: string
        default: ''
      chart_version:
        description: 'Version of chart_reference'
        required: false
        type: string
        default: ''
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SSH_KEY:
        required: true
      SLACK_BOT_TOKEN:
        required: false
      SLACK_CHANNEL_ID:
        required: false
  workflow_dispatch:
    inputs:
      operator_image:
        description: 'Operator image to test (override)'
        required: false
        type: string
      operator_version:
        description: 'Operator version to test (override)'
        required: false
        type: string
      chart_reference:
        description: 'Published Helm chart to test instead of publishing one from this commit (set chart_version, and operator_version to its appVersion)'
        required: false
        type: string
        default: ''
      chart_version:
        description: 'Version of chart_reference'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  variables:
    uses: ./.github/workflows/variables.yaml
    with:
      operator_image: ${{ inputs.operator_image }}
      operator_version: ${{ inputs.operator_version }}

  publish-helm-oci-chart:
    needs: [variables]
    if: ${{ !inputs.chart_reference }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-helm-oci-chart.yaml
    with:
      operator_image: ${{ needs.variables.outputs.operator_image }}
      operator_version: ${{ needs.variables.outputs.operator_version }}

  e2e-tests-containerd:
    needs: [variables, publish-helm-oci-chart]
    if: ${{ !cancelled() && needs.variables.result == 'success' && (needs.publish-helm-oci-chart.result == 'success' || needs.publish-helm-oci-chart.result == 'skipped') }}
    runs-on: linux-amd64-cpu4
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      HELM_CHART: ${{ inputs.chart_reference || needs.publish-helm-oci-chart.outputs.chart_reference }}
      HELM_CHART_VERSION: ${{ inputs.chart_reference && inputs.chart_version || needs.publish-helm-oci-chart.outputs.chart_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        name: Check out code
        with:
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Verify the published Helm chart is available
        env:
          INPUT_CHART_REFERENCE: ${{ inputs.chart_reference }}
          INPUT_CHART_VERSION: ${{ inputs.chart_version }}
          OPERATOR_VERSION: ${{ needs.variables.outputs.operator_version }}
        run: |
          if [[ -n "${INPUT_CHART_VERSION}" && -z "${INPUT_CHART_REFERENCE}" ]]; then
            echo "::error::chart_version requires chart_reference"
            exit 1
          fi
          if [[ -z "${HELM_CHART_VERSION}" ]]; then
            echo "::error::chart_reference requires chart_version"
            exit 1
          fi
          chart_metadata=$(helm show chart "${HELM_CHART}" --version "${HELM_CHART_VERSION}")
          echo "${chart_metadata}"
          chart_app_version=$(awk '/^appVersion:/ {print $2}' <<< "${chart_metadata}" | tr -d '"')
          if [[ -n "${INPUT_CHART_REFERENCE}" && "${chart_app_version}" != "${OPERATOR_VERSION}" ]]; then
            echo "::error::operator_version ${OPERATOR_VERSION} does not match the chart's appVersion ${chart_app_version}"
            exit 1
          fi
      - name: Set up Holodeck
        uses: NVIDIA/holodeck@e0f3932cf284d92421a55536839fa821a14116aa # v0.3.7
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_ssh_key: ${{ secrets.AWS_SSH_KEY }}
          holodeck_config: "tests/holodeck.yaml"
      - name: Get public dns name
        id: get_public_dns_name
        uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4
        with:
          cmd: yq '.status.properties[] | select(.name == "public-dns-name") | .value' /github/workspace/.cache/holodeck.yaml
      - name: Set test environment
        env:
          PUBLIC_DNS_NAME: ${{ steps.get_public_dns_name.outputs.result }}
        run: |
          echo "instance_hostname=ubuntu@${PUBLIC_DNS_NAME}" >> $GITHUB_ENV
          echo "private_key=${{ github.workspace }}/key.pem" >> $GITHUB_ENV
      - name: Write SSH key
        env:
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          echo "${AWS_SSH_KEY}" > ${private_key} && chmod 400 ${private_key}
      - name: Run e2e tests
        env:
          OPERATOR_VERSION: ${{ needs.variables.outputs.operator_version }}
          OPERATOR_IMAGE: ${{ needs.variables.outputs.operator_image }}
          GPU_PRODUCT_NAME: "Tesla-T4"
          SKIP_LAUNCH: "true"
          CONTAINER_RUNTIME: "containerd"
          TEST_CASE: "./tests/cases/defaults.sh"
        run: |
          ./tests/ci-run-e2e.sh ${OPERATOR_IMAGE} ${OPERATOR_VERSION} ${GPU_PRODUCT_NAME} ${TEST_CASE} || rc=$?
          ./tests/scripts/pull.sh /tmp/logs logs
          exit $rc
      - name: Archive test logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: containerd-e2e-test-logs
          path: ./logs/
          retention-days: 15

  e2e-tests-nvidiadriver:
    needs: [variables, publish-helm-oci-chart]
    if: ${{ !cancelled() && needs.variables.result == 'success' && (needs.publish-helm-oci-chart.result == 'success' || needs.publish-helm-oci-chart.result == 'skipped') }}
    runs-on: linux-amd64-cpu4
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      HELM_CHART: ${{ inputs.chart_reference || needs.publish-helm-oci-chart.outputs.chart_reference }}
      HELM_CHART_VERSION: ${{ inputs.chart_reference && inputs.chart_version || needs.publish-helm-oci-chart.outputs.chart_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        name: Check out code
        with:
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Verify the published Helm chart is available
        env:
          INPUT_CHART_REFERENCE: ${{ inputs.chart_reference }}
          INPUT_CHART_VERSION: ${{ inputs.chart_version }}
          OPERATOR_VERSION: ${{ needs.variables.outputs.operator_version }}
        run: |
          if [[ -n "${INPUT_CHART_VERSION}" && -z "${INPUT_CHART_REFERENCE}" ]]; then
            echo "::error::chart_version requires chart_reference"
            exit 1
          fi
          if [[ -z "${HELM_CHART_VERSION}" ]]; then
            echo "::error::chart_reference requires chart_version"
            exit 1
          fi
          chart_metadata=$(helm show chart "${HELM_CHART}" --version "${HELM_CHART_VERSION}")
          echo "${chart_metadata}"
          chart_app_version=$(awk '/^appVersion:/ {print $2}' <<< "${chart_metadata}" | tr -d '"')
          if [[ -n "${INPUT_CHART_REFERENCE}" && "${chart_app_version}" != "${OPERATOR_VERSION}" ]]; then
            echo "::error::operator_version ${OPERATOR_VERSION} does not match the chart's appVersion ${chart_app_version}"
            exit 1
          fi
      - name: Set up Holodeck
        uses: NVIDIA/holodeck@e0f3932cf284d92421a55536839fa821a14116aa # v0.3.7
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_ssh_key: ${{ secrets.AWS_SSH_KEY }}
          holodeck_config: "tests/holodeck.yaml"
      - name: Get public dns name
        id: get_public_dns_name
        uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4
        with:
          cmd: yq '.status.properties[] | select(.name == "public-dns-name") | .value' /github/workspace/.cache/holodeck.yaml
      - name: Set test environment
        env:
          PUBLIC_DNS_NAME: ${{ steps.get_public_dns_name.outputs.result }}
        run: |
          echo "instance_hostname=ubuntu@${PUBLIC_DNS_NAME}" >> $GITHUB_ENV
          echo "private_key=${{ github.workspace }}/key.pem" >> $GITHUB_ENV
      - name: Write SSH key
        env:
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          echo "${AWS_SSH_KEY}" > ${private_key} && chmod 400 ${private_key}
      - name: Run e2e tests
        env:
          OPERATOR_VERSION: ${{ needs.variables.outputs.operator_version }}
          OPERATOR_IMAGE: ${{ needs.variables.outputs.operator_image }}
          GPU_PRODUCT_NAME: "Tesla-T4"
          SKIP_LAUNCH: "true"
          CONTAINER_RUNTIME: "containerd"
          TEST_CASE: "./tests/cases/nvidia-driver.sh"
        run: |
          ./tests/ci-run-e2e.sh ${OPERATOR_IMAGE} ${OPERATOR_VERSION} ${GPU_PRODUCT_NAME} ${TEST_CASE} || rc=$?
          ./tests/scripts/pull.sh /tmp/logs logs
          exit $rc
      - name: Archive test logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nvidiadriver-e2e-test-logs
          path: ./logs/
          retention-days: 15
