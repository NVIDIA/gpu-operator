name: E2E Tests

on:
  workflow_call:
    inputs:
      operator_image:
        required: true
        type: string
      operator_version:
        required: true
        type: string
      use_values_override:
        required: false
        type: boolean
        default: false
        description: 'Use values-overrides artifact for component image configuration'
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SSH_KEY:
        required: true
      SLACK_BOT_TOKEN:
        required: false
      SLACK_CHANNEL_ID:
        required: false
  workflow_dispatch:
    inputs:
      operator_image:
        description: 'Operator image to test (override)'
        required: false
        type: string
      operator_version:
        description: 'Operator version to test (override)'
        required: false
        type: string
      use_values_override:
        description: 'Use values-overrides artifact for component image configuration'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  HELM_VERSION: v3.21.4
  KUBECTL_VERSION: v1.35.4
  JQ_VERSION: "1.8.2"
  JQ_SHA256: "b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f"

jobs:
  variables:
    uses: ./.github/workflows/variables.yaml
    with:
      operator_image: ${{ inputs.operator_image }}
      operator_version: ${{ inputs.operator_version }}

  publish-helm-oci-chart:
    needs: [variables]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-helm-oci-chart.yaml
    with:
      operator_image: ${{ needs.variables.outputs.operator_image }}
      operator_version: ${{ needs.variables.outputs.operator_version }}

  e2e-tests-containerd:
    needs: [variables, publish-helm-oci-chart]
    runs-on: linux-amd64-cpu4
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      KUBECONFIG: ${{ github.workspace }}/kubeconfig
      LOG_DIR: ${{ github.workspace }}/logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        name: Check out code
        with:
          persist-credentials: false
      - name: Download values override file
        if: ${{ inputs.use_values_override }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: values-overrides
          path: ${{ github.workspace }}
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Verify the published Helm chart is available
        env:
          HELM_CHART: ${{ needs.publish-helm-oci-chart.outputs.chart_reference }}
          HELM_CHART_VERSION: ${{ needs.publish-helm-oci-chart.outputs.chart_version }}
        run: helm show chart "${HELM_CHART}" --version "${HELM_CHART_VERSION}"
      - name: Install kubectl
        uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with:
          version: ${{ env.KUBECTL_VERSION }}
      - name: Install jq and verify runner tooling
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL -o "${RUNNER_TEMP}/bin/jq" \
            "https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/jq-linux-amd64"
          echo "${JQ_SHA256}  ${RUNNER_TEMP}/bin/jq" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/bin/jq"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          helm version
          kubectl version --client
          "${RUNNER_TEMP}/bin/jq" --version
      - name: Set up Holodeck
        uses: NVIDIA/holodeck@e0f3932cf284d92421a55536839fa821a14116aa # v0.3.7
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_ssh_key: ${{ secrets.AWS_SSH_KEY }}
          holodeck_config: "tests/holodeck.yaml"
      - name: Get public dns name
        id: get_public_dns_name
        uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4
        with:
          cmd: yq '.status.properties[] | select(.name == "public-dns-name") | .value' /github/workspace/.cache/holodeck.yaml
      - name: Configure node SSH access
        env:
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          PUBLIC_DNS_NAME: ${{ steps.get_public_dns_name.outputs.result }}
        run: |
          set -euo pipefail
          test -n "${PUBLIC_DNS_NAME}"
          SSH_DIR="${RUNNER_TEMP}/holodeck-ssh"
          mkdir -p "${SSH_DIR}"
          chmod 700 "${SSH_DIR}"
          install -m 600 /dev/null "${SSH_DIR}/id_rsa"
          printf '%s\n' "${AWS_SSH_KEY}" > "${SSH_DIR}/id_rsa"
          install -m 600 /dev/null "${SSH_DIR}/known_hosts"
          {
            echo "NODE_SSH_HOST=ubuntu@${PUBLIC_DNS_NAME}"
            echo "NODE_SSH_KEY=${SSH_DIR}/id_rsa"
            echo "NODE_SSH_KNOWN_HOSTS=${SSH_DIR}/known_hosts"
          } >> "$GITHUB_ENV"
      - name: Verify cluster access
        run: |
          set -euo pipefail
          test -r "${KUBECONFIG}"
          kubectl cluster-info
          kubectl get nodes -o wide
      - name: Select values override file
        if: ${{ inputs.use_values_override }}
        run: |
          set -euo pipefail
          echo "VALUES_FILE=${GITHUB_WORKSPACE}/values-overrides.yaml" >> "$GITHUB_ENV"
      - name: Load kernel modules on the node
        run: |
          set -euo pipefail
          test -n "${NODE_SSH_HOST}"
          ./tests/scripts/node-exec.sh load-modules
      - name: Run e2e tests
        env:
          OPERATOR_VERSION: ${{ needs.variables.outputs.operator_version }}
          OPERATOR_IMAGE: ${{ needs.variables.outputs.operator_image }}
          HELM_CHART: ${{ needs.publish-helm-oci-chart.outputs.chart_reference }}
          HELM_CHART_VERSION: ${{ needs.publish-helm-oci-chart.outputs.chart_version }}
          GPU_PRODUCT_NAME: "Tesla-T4"
          CONTAINER_RUNTIME: "containerd"
        run: |
          set -euo pipefail
          test -n "${NODE_SSH_HOST}"
          mkdir -p "${LOG_DIR}"
          ./tests/cases/defaults.sh
      - name: Collect cluster diagnostics
        if: always()
        run: |
          mkdir -p "${LOG_DIR}"
          kubectl get nodes -o wide --request-timeout=15s > "${LOG_DIR}/nodes.txt" 2>&1 || true
          kubectl get pods -A -o wide --request-timeout=15s > "${LOG_DIR}/pods.txt" 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp --request-timeout=15s > "${LOG_DIR}/events.txt" 2>&1 || true
          timeout 30s helm list -A > "${LOG_DIR}/helm-releases.txt" 2>&1 || true
      - name: Archive test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: containerd-e2e-test-logs
          path: ./logs/
          retention-days: 15
      - name: Remove credentials from the runner
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/holodeck-ssh"
          rm -f "${KUBECONFIG}"

  e2e-tests-nvidiadriver:
    needs: [variables, publish-helm-oci-chart]
    runs-on: linux-amd64-cpu4
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      KUBECONFIG: ${{ github.workspace }}/kubeconfig
      LOG_DIR: ${{ github.workspace }}/logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        name: Check out code
        with:
          persist-credentials: false
      - name: Download values override file
        if: ${{ inputs.use_values_override }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: values-overrides
          path: ${{ github.workspace }}
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Verify the published Helm chart is available
        env:
          HELM_CHART: ${{ needs.publish-helm-oci-chart.outputs.chart_reference }}
          HELM_CHART_VERSION: ${{ needs.publish-helm-oci-chart.outputs.chart_version }}
        run: helm show chart "${HELM_CHART}" --version "${HELM_CHART_VERSION}"
      - name: Install kubectl
        uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with:
          version: ${{ env.KUBECTL_VERSION }}
      - name: Install jq and verify runner tooling
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL -o "${RUNNER_TEMP}/bin/jq" \
            "https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/jq-linux-amd64"
          echo "${JQ_SHA256}  ${RUNNER_TEMP}/bin/jq" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/bin/jq"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          helm version
          kubectl version --client
          "${RUNNER_TEMP}/bin/jq" --version
      - name: Set up Holodeck
        uses: NVIDIA/holodeck@e0f3932cf284d92421a55536839fa821a14116aa # v0.3.7
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_ssh_key: ${{ secrets.AWS_SSH_KEY }}
          holodeck_config: "tests/holodeck.yaml"
      - name: Get public dns name
        id: get_public_dns_name
        uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4
        with:
          cmd: yq '.status.properties[] | select(.name == "public-dns-name") | .value' /github/workspace/.cache/holodeck.yaml
      - name: Configure node SSH access
        env:
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          PUBLIC_DNS_NAME: ${{ steps.get_public_dns_name.outputs.result }}
        run: |
          set -euo pipefail
          test -n "${PUBLIC_DNS_NAME}"
          SSH_DIR="${RUNNER_TEMP}/holodeck-ssh"
          mkdir -p "${SSH_DIR}"
          chmod 700 "${SSH_DIR}"
          install -m 600 /dev/null "${SSH_DIR}/id_rsa"
          printf '%s\n' "${AWS_SSH_KEY}" > "${SSH_DIR}/id_rsa"
          install -m 600 /dev/null "${SSH_DIR}/known_hosts"
          {
            echo "NODE_SSH_HOST=ubuntu@${PUBLIC_DNS_NAME}"
            echo "NODE_SSH_KEY=${SSH_DIR}/id_rsa"
            echo "NODE_SSH_KNOWN_HOSTS=${SSH_DIR}/known_hosts"
          } >> "$GITHUB_ENV"
      - name: Verify cluster access
        run: |
          set -euo pipefail
          test -r "${KUBECONFIG}"
          kubectl cluster-info
          kubectl get nodes -o wide
      - name: Select values override file
        if: ${{ inputs.use_values_override }}
        run: |
          set -euo pipefail
          echo "VALUES_FILE=${GITHUB_WORKSPACE}/values-overrides.yaml" >> "$GITHUB_ENV"
      - name: Load kernel modules on the node
        run: |
          set -euo pipefail
          test -n "${NODE_SSH_HOST}"
          ./tests/scripts/node-exec.sh load-modules
      - name: Run e2e tests
        env:
          OPERATOR_VERSION: ${{ needs.variables.outputs.operator_version }}
          OPERATOR_IMAGE: ${{ needs.variables.outputs.operator_image }}
          HELM_CHART: ${{ needs.publish-helm-oci-chart.outputs.chart_reference }}
          HELM_CHART_VERSION: ${{ needs.publish-helm-oci-chart.outputs.chart_version }}
          GPU_PRODUCT_NAME: "Tesla-T4"
          CONTAINER_RUNTIME: "containerd"
        run: |
          set -euo pipefail
          test -n "${NODE_SSH_HOST}"
          mkdir -p "${LOG_DIR}"
          ./tests/cases/nvidia-driver.sh
      - name: Collect cluster diagnostics
        if: always()
        run: |
          mkdir -p "${LOG_DIR}"
          kubectl get nodes -o wide --request-timeout=15s > "${LOG_DIR}/nodes.txt" 2>&1 || true
          kubectl get pods -A -o wide --request-timeout=15s > "${LOG_DIR}/pods.txt" 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp --request-timeout=15s > "${LOG_DIR}/events.txt" 2>&1 || true
          timeout 30s helm list -A > "${LOG_DIR}/helm-releases.txt" 2>&1 || true
      - name: Archive test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
