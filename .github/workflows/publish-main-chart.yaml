name: Publish Main Chart and Bundle

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      overwrite:
        description: "Replace today's main build if it is already published"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  variables:
    permissions:
      contents: read
    uses: ./.github/workflows/variables.yaml

  main-version:
    needs: [variables]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      main_version: ${{ steps.main-version.outputs.main_version }}
      publish: ${{ steps.main-version.outputs.publish }}
    steps:
      - name: Require the default branch
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "::error::Main charts are published only from ${DEFAULT_BRANCH}"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Get regctl version
        run: |
          REGCTL_VERSION=$(grep "REGCTL_VERSION ?=" versions.mk)
          echo "REGCTL_VERSION=${REGCTL_VERSION##REGCTL_VERSION ?= }" >> "${GITHUB_ENV}"

      - name: Install regctl
        uses: regclient/actions/regctl-installer@148669fe4b19151fcab6e00c6df2db43b9e2b097
        with:
          release: ${{ env.REGCTL_VERSION }}

      - name: Login to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GH_TOKEN}" | regctl registry login ghcr.io -u "${GITHUB_ACTOR}" --pass-stdin

      - name: Set main version and check whether it is published
        id: main-version
        env:
          OPERATOR_IMAGE_BASE: ${{ needs.variables.outputs.operator_image_base }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          set -euo pipefail

          main_version="0.0.0-main-$(date -u +%Y%m%d)"
          echo "main_version=${main_version}" >> "${GITHUB_OUTPUT}"

          if record_lookup_error=$(regctl manifest head "${OPERATOR_IMAGE_BASE}/main-builds:${main_version}" 2>&1 > /dev/null); then
            if [[ "${OVERWRITE}" != "true" ]]; then
              echo "::notice::Main build ${main_version} is already published; run this workflow with overwrite to replace it"
              echo "publish=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          elif [[ "${record_lookup_error}" != *"[http 404]"* ]]; then
            echo "::error::Could not check whether main build ${main_version} is published: ${record_lookup_error}"
            exit 1
          fi
          echo "publish=true" >> "${GITHUB_OUTPUT}"

  prepare-main-values:
    needs: [variables, main-version]
    if: ${{ needs.main-version.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      resolved_images: ${{ steps.images.outputs.resolved_images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Get regctl version
        run: |
          REGCTL_VERSION=$(grep "REGCTL_VERSION ?=" versions.mk)
          echo "REGCTL_VERSION=${REGCTL_VERSION##REGCTL_VERSION ?= }" >> "${GITHUB_ENV}"

      - name: Install regctl
        uses: regclient/actions/regctl-installer@148669fe4b19151fcab6e00c6df2db43b9e2b097
        with:
          release: ${{ env.REGCTL_VERSION }}

      - name: Verify the operator image exists
        env:
          OPERATOR_IMAGE: ${{ needs.variables.outputs.operator_image }}
          OPERATOR_VERSION: ${{ needs.variables.outputs.operator_version }}
        run: |
          if ! regctl manifest head "${OPERATOR_IMAGE}:${OPERATOR_VERSION}" > /dev/null; then
            echo "::error::${OPERATOR_IMAGE}:${OPERATOR_VERSION} is not built yet; rerun once CI has published it"
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Prepare main chart values
        id: images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPERATOR_IMAGE: ${{ needs.variables.outputs.operator_image }}
          OPERATOR_VERSION: ${{ needs.variables.outputs.operator_version }}
        run: |
          set -euo pipefail

          resolved_image_lines=$(.github/scripts/prepare-main-values.sh \
            deployments/gpu-operator values-overrides.yaml "${OPERATOR_IMAGE}" "${OPERATOR_VERSION}")
          echo "resolved_images=${resolved_image_lines//$'\n'/ }" >> "${GITHUB_OUTPUT}"

      - name: Upload values override file and merged chart values
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: main-values
          path: |
            values-overrides.yaml
            deployments/gpu-operator/values.yaml
          retention-days: 30

  publish-main-chart:
    needs: [variables, main-version, prepare-main-values]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-helm-oci-chart.yaml
    with:
      operator_image: ${{ needs.variables.outputs.operator_image }}
      operator_version: ${{ needs.variables.outputs.operator_version }}
      main_chart_version: ${{ needs.main-version.outputs.main_version }}

  publish-main-bundle:
    needs: [variables, main-version, prepare-main-values]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      bundle_image: ${{ steps.bundle.outputs.bundle-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up OLM bundle tools
        uses: ./.github/actions/setup-olm-bundle-tools

      - name: Download values override file and merged chart values
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: main-values
          path: ${{ github.workspace }}

      - name: Update OLM bundle images
        run: |
          python3 .github/scripts/update-csv-images.py \
            --values deployments/gpu-operator/values.yaml \
            --chart deployments/gpu-operator/Chart.yaml \
            --csv bundle/manifests/gpu-operator-certified.clusterserviceversion.yaml

      - name: Check the CSV related images include every override image
        env:
          CSV: bundle/manifests/gpu-operator-certified.clusterserviceversion.yaml
        run: |
          set -euo pipefail

          override_images=$(yq '.. | select(tag == "!!map" and has("image")) | .repository + "/" + .image + ":" + .version' values-overrides.yaml | sort -u)
          csv_related_images=$(yq '.spec.relatedImages[].image | sub("@sha256:[0-9a-f]+$", "")' "${CSV}" | sort -u)
          missing_images=$(comm -23 <(echo "${override_images}") <(echo "${csv_related_images}"))
          if [[ -n "${missing_images}" ]]; then
            echo "::error::CSV relatedImages are missing override images:"
            echo "${missing_images}"
            exit 1
          fi

      - name: Validate and push OLM bundle
        id: bundle
        uses: ./.github/actions/validate-and-push-olm-bundle
        with:
          bundle-image-tag: ${{ needs.main-version.outputs.main_version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  record-main-build:
    needs: [variables, main-version, prepare-main-values, publish-main-chart, publish-main-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Get regctl version
        run: |
          REGCTL_VERSION=$(grep "REGCTL_VERSION ?=" versions.mk)
          echo "REGCTL_VERSION=${REGCTL_VERSION##REGCTL_VERSION ?= }" >> "${GITHUB_ENV}"

      - name: Install regctl
        uses: regclient/actions/regctl-installer@148669fe4b19151fcab6e00c6df2db43b9e2b097
        with:
          release: ${{ env.REGCTL_VERSION }}

      - name: Login to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GH_TOKEN}" | regctl registry login ghcr.io -u "${GITHUB_ACTOR}" --pass-stdin

      - name: Push the main build record
        env:
          OPERATOR_IMAGE_BASE: ${{ needs.variables.outputs.operator_image_base }}
          MAIN_VERSION: ${{ needs.main-version.outputs.main_version }}
          OPERATOR_IMAGE: ${{ needs.variables.outputs.operator_image }}
          OPERATOR_VERSION: ${{ needs.variables.outputs.operator_version }}
          CHART_REFERENCE: ${{ needs.publish-main-chart.outputs.chart_reference }}
          CHART_VERSION: ${{ needs.publish-main-chart.outputs.chart_version }}
          BUNDLE_IMAGE: ${{ needs.publish-main-bundle.outputs.bundle_image }}
          RESOLVED_IMAGES: ${{ needs.prepare-main-values.outputs.resolved_images }}
        run: |
          set -euo pipefail

          read -ra operand_images <<< "${RESOLVED_IMAGES}"
          .github/scripts/push-main-build-record.sh \
            "${OPERATOR_IMAGE_BASE}/main-builds" \
            "${MAIN_VERSION}" \
            "${OPERATOR_IMAGE}" \
            "${OPERATOR_VERSION}" \
            "${CHART_REFERENCE}" \
            "${CHART_VERSION}" \
            "${BUNDLE_IMAGE}" \
            "${operand_images[@]}"

  notify-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    needs: [variables, main-version, prepare-main-values, publish-main-chart, publish-main-bundle, record-main-build]
    if: ${{ always() && github.event_name == 'schedule' && (needs.variables.result == 'failure' || needs.main-version.result == 'failure' || needs.prepare-main-values.result == 'failure' || needs.publish-main-chart.result == 'failure' || needs.publish-main-bundle.result == 'failure' || needs.record-main-build.result == 'failure') }}
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    steps:
      - name: Send Slack alert notification
        if: ${{ env.SLACK_BOT_TOKEN != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": ":x: *GPU Operator Main Build Publish Failed*\n\n*Workflow:* ${{ github.workflow }}\n*Repository:* ${{ github.repository }}\n*Trigger:* ${{ github.event_name }}\n\n*Resolved Images:* ${{ needs.prepare-main-values.outputs.resolved_images || 'not resolved; see the run log' }}\n\n*Details:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Failed Run>\n\n${{ secrets.SLACK_MENTION_LIST }}"
            }
