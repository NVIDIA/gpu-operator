# Regenerates THIRD_PARTY_NOTICES.md and fails if it differs from the committed
# copy, so a dependency change cannot land without refreshed attribution.

name: Third-Party Notices Check

on:
  workflow_call:

jobs:
  check-third-party-notices:
    runs-on: linux-amd64-cpu4
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get Golang version
        run: |
          GOLANG_VERSION=$( grep "GOLANG_VERSION ?=" versions.mk )
          echo "GOLANG_VERSION=${GOLANG_VERSION##GOLANG_VERSION ?= }" >> "${GITHUB_ENV}"

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GOLANG_VERSION }}

      - name: Setup Go Proxy
        id: setup-go-proxy
        uses: nv-gha-runners/setup-artifactory-go-proxy@main

      - name: Verify THIRD_PARTY_NOTICES.md is up to date
        env:
          GOPROXY: ${{ steps.setup-go-proxy.outputs.goproxy-url }}
        run: make check-third-party-notices
