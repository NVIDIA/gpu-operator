apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nvidia-dcgm-exporter
  namespace: "FILLED BY THE OPERATOR"
  labels:
    app: nvidia-dcgm-exporter
spec:
  # Each rule reads the dcgm-exporter 4.9.0 metric name and converts it back to
  # the unit this series has always reported, so existing dashboards and alerts
  # see the same values. The `or <old name>` fallback covers dcgm-exporter 4.8.x
  # names: a rolling upgrade (old and new exporters run side by side), a pinned
  # dcgmExporter.version, and custom metrics ConfigMaps that still list old
  # names. Remove the fallbacks once no supported operator release ships a
  # pre-4.9.0 exporter and the operator docs require DCGM 4.7 names in custom
  # metrics CSVs.
  #
  # Units kept: percent for both utilizations, MiB for framebuffer total, MHz
  # for clocks. Some series names say bytes or hertz; changing the values to
  # match would break existing consumers, so the units stay as they were.
  groups:
  - name: dcgm.accelerator.metrics
    interval: 30s
    rules:
    - record: accelerator_gpu_utilization
      expr: (DCGM_FI_DEV_GPU_UTIL_RATIO * 100) or DCGM_FI_DEV_GPU_UTIL
      labels:
        vendor: "nvidia"

    - record: accelerator_memory_used_bytes
      expr: (DCGM_FI_DEV_MEMORY_UTIL_RATIO * 100) or DCGM_FI_DEV_MEM_COPY_UTIL
      labels:
        vendor: "nvidia"

    - record: accelerator_memory_total_bytes
      expr: (DCGM_FI_DEV_FB_CAPACITY_BYTES / 1048576) or DCGM_FI_DEV_FB_TOTAL
      labels:
        vendor: "nvidia"

    - record: accelerator_power_usage_watts
      expr: DCGM_FI_DEV_BOARD_POWER_WATTS or DCGM_FI_DEV_POWER_USAGE
      labels:
        vendor: "nvidia"

    - record: accelerator_temperature_celsius
      expr: DCGM_FI_DEV_GPU_TEMP_CELSIUS or DCGM_FI_DEV_GPU_TEMP
      labels:
        vendor: "nvidia"

    - record: accelerator_sm_clock_hertz
      expr: (DCGM_FI_DEV_SM_CLOCK_HERTZ / 1000000) or DCGM_FI_DEV_SM_CLOCK
      labels:
        vendor: "nvidia"

    - record: accelerator_memory_clock_hertz
      expr: (DCGM_FI_DEV_MEMORY_CLOCK_HERTZ / 1000000) or DCGM_FI_DEV_MEM_CLOCK
      labels:
        vendor: "nvidia"
