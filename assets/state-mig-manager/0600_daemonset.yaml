apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-mig-manager
  namespace: "FILLED BY THE OPERATOR"
  labels:
    app: nvidia-mig-manager
spec:
  selector:
    matchLabels:
      app: nvidia-mig-manager
  template:
    metadata:
      labels:
        app: nvidia-mig-manager
    spec:
      nodeSelector:
        nvidia.com/gpu.deploy.mig-manager: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      priorityClassName: system-node-critical
      serviceAccountName: nvidia-mig-manager
      hostPID: true
      hostIPC: true
      initContainers:
        - name: driver-validation
          image: "FILLED BY THE OPERATOR"
          command: ["nvidia-validator"]
          env:
            - name: WITH_WAIT
              value: "true"
            - name: COMPONENT
              value: driver
            - name: OUTPUT_DIR
              value: /run/nvidia/mig-manager/validations
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            privileged: true
            seLinuxOptions:
              level: "s0"
          volumeMounts:
            - name: host-root
              mountPath: /host
              readOnly: true
              mountPropagation: HostToContainer
            - name: driver-install-dir
              mountPath: /run/nvidia/driver
              mountPropagation: HostToContainer
            # The driver container writes .driver-ctr-ready here. Validator
            # results go to a separate volume so pausing operator-validator
            # cannot remove MIG Manager's startup prerequisites.
            - name: run-nvidia-validations
              mountPath: /run/nvidia/validations
              readOnly: true
            - name: mig-manager-validations
              mountPath: /run/nvidia/mig-manager/validations
            - name: host-dev-char
              mountPath: /host-dev-char
        - name: toolkit-validation
          image: "FILLED BY THE OPERATOR"
          command: ["nvidia-validator"]
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            # Runtime injection happens at container creation. Let kubelet
            # recreate this init container if the toolkit is not ready yet.
            - name: WITH_WAIT
              value: "false"
            - name: COMPONENT
              value: toolkit
            - name: OUTPUT_DIR
              value: /run/nvidia/mig-manager/validations
          securityContext:
            privileged: true
          volumeMounts:
            - name: mig-manager-validations
              mountPath: /run/nvidia/mig-manager/validations
      containers:
      - name: nvidia-mig-manager
        image: "FILLED BY THE OPERATOR"
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, -c]
        args:
          - /bin/entrypoint.sh
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: GPU_CLIENTS_FILE
          value: "/gpu-clients/clients.yaml"
        - name: DEFAULT_GPU_CLIENTS_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        securityContext:
          privileged: true
        volumeMounts:
        - name: nvidia-mig-manager-entrypoint
          readOnly: true
          mountPath: /bin/entrypoint.sh
          subPath: entrypoint.sh
        - name: mig-manager-validations
          mountPath: /run/nvidia/mig-manager/validations
        - mountPath: /sys
          name: host-sys
        - mountPath: /host
          name: host-root
          mountPropagation: HostToContainer
        - mountPath: /gpu-clients
          name: gpu-clients
        - mountPath: /mig-parted-config
          name: mig-parted-config
        - name: driver-install-dir
          mountPath: /driver-root
          mountPropagation: HostToContainer
        - name: cdi-root
          mountPath: /var/run/cdi
      volumes:
      - name: nvidia-mig-manager-entrypoint
        configMap:
          name: nvidia-mig-manager-entrypoint
          defaultMode: 448
      - name: host-sys
        hostPath:
          path: /sys
          type: Directory
      - name: run-nvidia-validations
        hostPath:
          path: "/run/nvidia/validations"
          type: DirectoryOrCreate
      - name: mig-manager-validations
        emptyDir: {}
      - name: host-dev-char
        hostPath:
          path: /dev/char
          type: DirectoryOrCreate
      - name: driver-install-dir
        hostPath:
          path: "/run/nvidia/driver"
          type: DirectoryOrCreate
      - name: host-root
        hostPath:
          path: "/"
      - name: gpu-clients
        configMap:
          name: "FILLED_BY_OPERATOR"
      - name: mig-parted-config
        configMap:
          name: "FILLED_BY_OPERATOR"
      - name: cdi-root
        hostPath:
          path: /var/run/cdi
          type: DirectoryOrCreate
