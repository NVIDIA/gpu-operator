apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: nvidia-vgpu-device-manager
  namespace: "FILLED BY THE OPERATOR"
  name: nvidia-vgpu-device-manager
  annotations:
    openshift.io/scc: nvidia-vgpu-device-manager
spec:
  selector:
    matchLabels:
      app: nvidia-vgpu-device-manager
  template:
    metadata:
      labels:
        app: nvidia-vgpu-device-manager
    spec:
      nodeSelector:
        nvidia.com/gpu.deploy.vgpu-device-manager: "true"
      priorityClassName: system-node-critical
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      serviceAccountName: nvidia-vgpu-device-manager
      initContainers:
        - name: vgpu-manager-validation
          image: "FILLED BY THE OPERATOR"
          command: ['sh', '-c']
          args: ["nvidia-validator"]
          env:
          - name: WITH_WAIT
            value: "true"
          - name: COMPONENT
            value: vgpu-manager
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          securityContext:
            privileged: true
            seLinuxOptions:
              level: "s0"
          volumeMounts:
            - name: host-root
              mountPath: /host
              readOnly: true
              mountPropagation: HostToContainer
            - name: driver-install-dir
              mountPath: /run/nvidia/driver
              readOnly: true
              mountPropagation: HostToContainer
            - name: run-nvidia-validations
              mountPath: /run/nvidia/validations
              mountPropagation: Bidirectional
      containers:
      - name: nvidia-vgpu-device-manager
        image: "FILLED BY THE OPERATOR"
        imagePullPolicy: IfNotPresent
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: CONFIG_FILE
          value: "/vgpu-config/config.yaml"
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /vgpu-config
          name: vgpu-config
        - mountPath: /sys
          name: host-sys
        - mountPath: /host
          name: host-root
          mountPropagation: HostToContainer
        - name: driver-install-dir
          mountPath: /driver-root
          mountPropagation: HostToContainer
      volumes:
      - name: vgpu-config
        configMap:
          name: "FILLED BY THE OPERATOR"
      - name: host-sys
        hostPath:
          path: /sys
          type: Directory
      - name: host-root
        hostPath:
          path: "/"
      - name: driver-install-dir
        hostPath:
          path: "/run/nvidia/driver"
          type: DirectoryOrCreate
      - name: run-nvidia-validations
        hostPath:
          path: /run/nvidia/validations
          type: DirectoryOrCreate
