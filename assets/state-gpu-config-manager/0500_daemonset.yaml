apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-gpu-config-manager
  namespace: "FILLED BY THE OPERATOR"
  labels:
    app: nvidia-gpu-config-manager
    app.kubernetes.io/component: nvidia-gpu-config-manager
    app.kubernetes.io/part-of: gpu-operator
spec:
  selector:
    matchLabels:
      app: nvidia-gpu-config-manager
  template:
    metadata:
      labels:
        app: nvidia-gpu-config-manager
        app.kubernetes.io/component: nvidia-gpu-config-manager
        app.kubernetes.io/part-of: gpu-operator
    spec:
      nodeSelector:
        nvidia.com/gpu.deploy.gpu-config-manager: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      priorityClassName: system-node-critical
      serviceAccountName: nvidia-gpu-config-manager
      # Keep below k8s-driver-manager's 5-minute wait for this pod to terminate.
      terminationGracePeriodSeconds: 90
      initContainers:
      - name: driver-validation
        image: "FILLED BY THE OPERATOR"
        imagePullPolicy: IfNotPresent
        command: ['sh', '-c']
        args: ["nvidia-validator"]
        env:
          - name: WITH_WAIT
            value: "true"
          - name: COMPONENT
            value: driver
          - name: OPERATOR_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        securityContext:
          privileged: true
          seLinuxOptions:
            level: "s0"
        volumeMounts:
          - name: driver-install-dir
            mountPath: /run/nvidia/driver
            mountPropagation: HostToContainer
          - name: run-nvidia-validations
            mountPath: /run/nvidia/validations
            mountPropagation: Bidirectional
          - name: host-root
            mountPath: /host
            readOnly: true
            mountPropagation: HostToContainer
          - name: host-dev-char
            mountPath: /host-dev-char
      containers:
      - name: nvidia-gpu-config-manager
        image: "FILLED BY THE OPERATOR"
        imagePullPolicy: IfNotPresent
        command: ["gpu-config-manager"]
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: OPERATOR_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: GPU_CONFIG_STACK
            value: container
          - name: GPU_CONFIG_CLUSTER_DOCUMENT
            value: "FILLED BY THE OPERATOR"
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
        securityContext:
          privileged: true
          runAsUser: 0
        volumeMounts:
          - name: run-nvidia-validations
            mountPath: /run/nvidia/validations
            mountPropagation: HostToContainer
          - name: driver-install-dir
            mountPath: /driver-root
            readOnly: true
            mountPropagation: HostToContainer
          - name: host-root
            mountPath: /host
            readOnly: true
            mountPropagation: HostToContainer
      volumes:
        - name: run-nvidia-validations
          hostPath:
            path: /run/nvidia/validations
            type: DirectoryOrCreate
        - name: driver-install-dir
          hostPath:
            path: /run/nvidia/driver
            type: DirectoryOrCreate
        - name: host-root
          hostPath:
            path: /
        - name: host-dev-char
          hostPath:
            path: /dev/char
