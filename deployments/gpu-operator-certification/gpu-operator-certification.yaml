apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-operator-certification
  namespace: gpu-operator
  labels:
    app.kubernetes.io/name: gpu-operator-certification
    app.kubernetes.io/instance: gpu-operator-certification
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-operator-certification
  labels:
    app.kubernetes.io/name: gpu-operator-certification
    app.kubernetes.io/instance: gpu-operator-certification
rules:
  # Core resources
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services/proxy"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  # Apps resources
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "delete"]
  # GPU Operator
  - apiGroups: ["nvidia.com"]
    resources: ["clusterpolicies"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["nvidia.com"]
    resources: ["nvidiadrivers"]
    verbs: ["list", "patch"]
  # KubeVirt (optional, for virtualization detection)
  - apiGroups: ["kubevirt.io"]
    resources: ["kubevirts"]
    verbs: ["list"]
  - apiGroups: ["hco.kubevirt.io"]
    resources: ["hyperconvergeds"]
    verbs: ["list"]
  # OpenShift (optional, for platform detection)
  - apiGroups: ["config.openshift.io"]
    resources: ["clusterversions", "proxies", "images"]
    verbs: ["get"]
  - apiGroups: ["machine.openshift.io"]
    resources: ["machines"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-operator-certification
  labels:
    app.kubernetes.io/name: gpu-operator-certification
    app.kubernetes.io/instance: gpu-operator-certification
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gpu-operator-certification
subjects:
  - kind: ServiceAccount
    name: gpu-operator-certification
    namespace: gpu-operator
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-operator-certification
  namespace: gpu-operator
  labels:
    app.kubernetes.io/name: gpu-operator-certification
    app.kubernetes.io/instance: gpu-operator-certification
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-operator-certification
        app.kubernetes.io/instance: gpu-operator-certification
    spec:
      serviceAccountName: gpu-operator-certification
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: certification
          image: "ghcr.io/nvidia/gpu-operator:main-latest"
          imagePullPolicy: Always
          command: ["gpu-operator-certification"]
          envFrom:
            - configMapRef:
                name: gpu-operator-certification-config
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: RESULTS_CONFIGMAP_NAME
              value: "gpu-operator-certification-results"
