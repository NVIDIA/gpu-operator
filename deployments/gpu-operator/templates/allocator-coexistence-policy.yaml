{{- if include "gpu-operator.allocatorAdmission" . }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: gpu-operator-clusterpolicy-creation
spec:
  # A retained policy must allow ClusterPolicy creation if the GPUCluster CRD is removed.
  failurePolicy: Ignore
  paramKind:
    apiVersion: nvidia.com/v1alpha1
    kind: GPUCluster
  matchConstraints:
    resourceRules:
    - apiGroups: ["nvidia.com"]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["clusterpolicies"]
      scope: Cluster
  validations:
  - expression: 'false'
    message: 'Cannot create ClusterPolicy while GPUCluster exists.'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: gpu-operator-clusterpolicy-creation
spec:
  policyName: gpu-operator-clusterpolicy-creation
  validationActions: [Deny]
  paramRef:
    selector: {}
    parameterNotFoundAction: Allow

{{- end }}
