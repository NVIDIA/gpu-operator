apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-operator-cleanup-gpucluster
  namespace: {{ .Release.Namespace }}
  annotations:
    # Wait for stack CR finalizers before Helm removes the operator and its
    # RBAC, or runs the CRD cleanup hook. Run even if a stack was disabled
    # in the chart after its CR was created.
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
  labels:
    {{- include "gpu-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: "gpu-operator"
spec:
  template:
    metadata:
      name: gpu-operator-cleanup-gpucluster
      labels:
        {{- include "gpu-operator.labels" . | nindent 8 }}
        app.kubernetes.io/component: "gpu-operator"
    spec:
      serviceAccountName: gpu-operator
      {{- if .Values.operator.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.operator.imagePullSecrets }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.operator.nodeSelector | nindent 8 }}
      {{- with .Values.operator.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.operator.dnsPolicy }}
      dnsPolicy: {{ .Values.operator.dnsPolicy }}
      {{- end }}
      {{- with .Values.operator.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cleanup-gpucluster
          image: {{ include "gpu-operator.fullimage" . }}
          imagePullPolicy: {{ .Values.operator.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /usr/bin/cleanup-gpuclusters
          {{- if .Values.operator.cleanupCRD }}
            - --all
          {{- else }}
            - --gpucluster-name
            - {{ include "gpu-operator.gpucluster-name" . }}
            - --clusterpolicy-name
            - cluster-policy
            - --release-name
            - {{ .Release.Name | quote }}
            - --release-namespace
            - {{ .Release.Namespace | quote }}
          {{- end }}
      restartPolicy: OnFailure
