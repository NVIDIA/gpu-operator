apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gpu-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: "gpu-operator"
    nvidia.com/gpu-driver-upgrade-drain.skip: "true"
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: "gpu-operator"
      app: "gpu-operator"
  template:
    metadata:
      labels:
        {{- include "gpu-operator.labels" . | nindent 8 }}
        app.kubernetes.io/component: "gpu-operator"
        app: "gpu-operator"
        nvidia.com/gpu-driver-upgrade-drain.skip: "true"
      annotations:
        {{- toYaml .Values.operator.annotations | nindent 8 }}
    spec:
      serviceAccountName: gpu-operator
      {{- if .Values.operator.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.operator.imagePullSecrets }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      {{- if .Values.operator.priorityClassName }}
      priorityClassName: {{ .Values.operator.priorityClassName }}
      {{- end }}
      {{- with .Values.operator.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.operator.dnsPolicy }}
      dnsPolicy: {{ .Values.operator.dnsPolicy }}
      {{- end }}
      {{- with .Values.operator.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: gpu-operator
        image: {{ include "gpu-operator.fullimage" . }}
        imagePullPolicy: {{ .Values.operator.imagePullPolicy }}
        command: ["gpu-operator"]
        args:
        - --leader-elect
      {{- with .Values.operator.leaderElection }}
        {{- if .renewDeadline }}
        - --leader-lease-renew-deadline={{ .renewDeadline }}
        {{- end }}
        {{- if .warmup }}
        - --leader-election-warmup
        {{- end }}
      {{- end }}
      {{- if .Values.operator.logging.develMode }}
        - --zap-devel
      {{- else }}
        {{- if .Values.operator.logging.timeEncoding }}
        - --zap-time-encoding={{- .Values.operator.logging.timeEncoding }}
        {{- end }}
        {{- if .Values.operator.logging.level }}
        - --zap-log-level={{- .Values.operator.logging.level }}
        {{- end }}
      {{- end }}
      {{- if .Values.operator.pprof.bindAddress }}
        - --pprof-bind-address={{ .Values.operator.pprof.bindAddress }}
      {{- end }}
        env:
        - name: WATCH_NAMESPACE
          value: ""
        - name: OPERATOR_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: "DRIVER_MANAGER_IMAGE"
          value: "{{ include "driver-manager.fullimage" . }}"
        - name: "VALIDATOR_IMAGE"
          value: "{{ include "validator.fullimage" . }}"
        {{- if .Values.operator.env }}
        {{- toYaml .Values.operator.env | nindent 8 }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
      {{- with .Values.operator.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
      {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
          - name: metrics
            containerPort: 8080
    {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- $affinity := .Values.operator.affinity | default dict }}
    {{- $podAntiAffinity := .Values.operator.podAntiAffinity | default dict }}
    {{- $addPodAntiAffinity := and $podAntiAffinity.enabled (gt (int .Values.operator.replicaCount) 1) (not (hasKey $affinity "podAntiAffinity")) }}
    {{- if or $affinity $addPodAntiAffinity }}
      affinity:
      {{- with $affinity }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $addPodAntiAffinity }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: "gpu-operator"
                  app: "gpu-operator"
      {{- end }}
    {{- end }}
    {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
