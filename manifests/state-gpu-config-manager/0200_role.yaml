apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nvidia-gpu-config-manager-dra
  namespace: {{ .Namespace }}
rules:
# ConfigMaps with the GPU settings.
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - list
  - watch
# The driver-validation init container and the GPU configuration manager list
# DaemonSets to determine whether the operator manages the driver.
- apiGroups:
  - apps
  resources:
  - daemonsets
  verbs:
  - list
